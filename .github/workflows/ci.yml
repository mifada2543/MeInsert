name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit test & manifest
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - run: npm ci
    - name: Bundel CSS harus sinkron dengan sumber
      run: npm run check:css
    - name: Lint
      run: npm run lint
    - name: Unit test
      run: npm test

  e2e:
    name: Smoke test browser
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - run: npm ci
    - name: Smoke test (Chrome headless)
      run: npm run test:e2e
      env:
        CHROME_BIN: /usr/bin/google-chrome
