name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: Unit test & manifest
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - run: npm ci
    - name: Asset sizes and gzip WASM integrity
      run: npm run check:assets
    - name: Bundel CSS harus sinkron dengan sumber
      run: npm run check:css
    - name: Policy HTML must match sources
      run: npm run check:policies
    - name: Lint
      run: npm run lint
    - name: Unit test
      run: npm test
  e2e:
    name: Browser suites ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - run: npm ci
    - name: Independent media tools
      run: |
        if ! command -v ffmpeg >/dev/null 2>&1; then
          sudo apt-get update && sudo apt-get install -y ffmpeg
        fi
    - name: Browser suites ${{ matrix.shard }}/4 (one shared Chrome via CDP)
      run: npm run test:e2e:all
      env:
        CHROME_BIN: /usr/bin/google-chrome
        MEINSERT_E2E_SHARD: ${{ matrix.shard }}/4
  offline-real:
    name: Real offline service worker (network + cache audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - run: npm ci
    - name: Real Service Worker offline audit
      run: npm run test:offline:real
      env:
        CHROME_BIN: /usr/bin/google-chrome
  compat:
    name: Real fixture compatibility (Chrome)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - run: npm ci
    - name: Independent media tools
      run: |
        if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v openssl >/dev/null 2>&1; then
          sudo apt-get update && sudo apt-get install -y ffmpeg openssl
        fi
    - name: Compatibility harness (checked-in fixtures)
      run: npm run test:compat
      env:
        CHROME_BIN: /usr/bin/google-chrome
        COMPAT_CONCURRENCY: '2'