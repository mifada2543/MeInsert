name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: Unit test & manifest
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - run: npm ci
    - name: Bundel CSS harus sinkron dengan sumber
      run: npm run check:css
    - name: Policy HTML must match sources
      run: npm run check:policies
    - name: Lint
      run: npm run lint
    - name: Unit test
      run: npm test

  e2e:
    name: Smoke test browser
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - run: npm ci
    - name: Independent media tools
      run: sudo apt-get update && sudo apt-get install -y ffmpeg
    - name: All browser suites (one shared Chrome via CDP)
      run: npm run test:e2e:all
      env:
        CHROME_BIN: /usr/bin/google-chrome
  compat:
    name: Real fixture compatibility (Chrome)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - run: npm ci
    - name: Independent media tools
      run: sudo apt-get update && sudo apt-get install -y ffmpeg openssl
    - name: Compatibility harness (checked-in fixtures)
      run: npm run test:compat
      env:
        CHROME_BIN: /usr/bin/google-chrome
        COMPAT_CONCURRENCY: '2'
